name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# read-only by default; only the release job below can write
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: '17' }
      - name: Android platform 17 and build-tools (the runner image has the SDK)
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-17" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with: { version: 0.17.0 }
      - name: Build the app and the ARM helpers
        run: python3 provision/y1.py build
      - name: Build the on-device speech engine
        run: sh java/android/native/stt/build.sh
      - name: Check the Python
        run: python3 -m py_compile provision/y1.py deploy/y1_setup.py custom_components/y1_player/*.py
      - name: Unit tests
        run: cd java/android && sh test/run.sh
      - name: Make the provisioning bundle
        run: provision/package.sh "${GITHUB_REF_NAME//\//-}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: y1-provision
          path: dist/*.zip
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: y1-provision
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.zip
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
