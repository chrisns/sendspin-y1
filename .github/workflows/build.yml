name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Android platform 17 and build-tools
        run: sdkmanager "platforms;android-17" "build-tools;34.0.0"
      - uses: mlugg/setup-zig@v1
      - name: Build the app and the ARM helpers
        run: python3 provision/y1.py build
      - name: Build the on-device speech engine
        run: sh java/android/native/stt/build.sh
      - name: Check the Python
        run: python3 -m py_compile provision/y1.py deploy/y1_setup.py custom_components/y1_player/*.py
      - name: Unit tests
        run: cd java/android && sh test/run.sh
      - name: Make the provisioning bundle
        run: provision/package.sh "${GITHUB_REF_NAME//\//-}"
      - uses: actions/upload-artifact@v4
        with:
          name: y1-provision
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
