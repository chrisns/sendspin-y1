# Home Assistant package for a Y1 player (put it in packages/, or copy the parts into your config).
# Entity ids match the device's generic defaults (y1_*); if you use other names, list them in the device config's
# "entities" and "events" (deploy/device.example.json). The identity helpers are created by
# `deploy/push_bedtime.py identity` too; they are here so everything lives in one place.

input_datetime:
  y1_bedtime_start: {name: Y1 bedtime starts, has_date: false, has_time: true, initial: "19:45"}
  y1_bedtime_end: {name: Y1 bedtime ends, has_date: false, has_time: true, initial: "06:30"}

input_number:
  y1_bedtime_cap_minutes: {name: Y1 bedtime listening (minutes), min: 0, max: 240, step: 5, initial: 20, mode: box}
  y1_bedtime_used_minutes: {name: Y1 bedtime minutes used, min: 0, max: 1440, step: 1, initial: 0, mode: box}

input_text:
  y1_owner_name: {name: Y1 owner name, max: 255}
  y1_device_name: {name: Y1 device name, max: 255}
  y1_lost_contact: {name: Y1 if-found contact (lines separated by |), max: 255}
  y1_home_wifi: {name: Y1 home Wi-Fi (comma separated), max: 255}
  y1_counted_speakers: {name: Y1 speakers HA already counts (comma separated), max: 255}
  y1_played_seq: {name: Y1 last minutes event, max: 32}

input_button:
  y1_find: {name: Find the Y1, icon: mdi:music-box}

automation:
  - id: y1_bedtime_reset
    alias: "Y1: reset the bedtime minutes when the window opens"
    triggers: [{trigger: time, at: input_datetime.y1_bedtime_start}]
    actions: [{action: input_number.set_value, target: {entity_id: input_number.y1_bedtime_used_minutes}, data: {value: 0}}]

  # The device is a read-only HA user: it cannot change entities, so it fires y1_played and this adds the minutes.
  # Replace USER_ID with the id of the child's HA user (Settings > People > Users) so only the device's events count.
  - id: y1_played
    alias: "Y1: add its bedtime minutes"
    mode: queued
    triggers: [{trigger: event, event_type: y1_played, context: {user_id: [USER_ID]}}]
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.minutes | int(0) >= 1 and trigger.event.data.minutes | int(0) <= 60 }}"
      - condition: template      # a resend after a lost reply carries the same seq: count it once
        value_template: "{{ trigger.event.data.seq is not defined or (trigger.event.data.seq | string) != states('input_text.y1_played_seq') }}"
    actions:
      - if: [{condition: template, value_template: "{{ trigger.event.data.seq is defined }}"}]
        then: [{action: input_text.set_value, target: {entity_id: input_text.y1_played_seq}, data: {value: "{{ trigger.event.data.seq | string }}"}}]
      - repeat:
          count: "{{ trigger.event.data.minutes | int(0) }}"
          sequence: [{action: input_number.increment, target: {entity_id: input_number.y1_bedtime_used_minutes}}]

  - id: y1_unlocked
    alias: "Y1: tell a parent about a grown-up unlock"
    triggers: [{trigger: event, event_type: y1_unlocked, context: {user_id: [USER_ID]}}]
    actions:
      - action: notify.notify    # or your phone's notify.mobile_app_* service
        data: {title: "Bedtime unlocked", message: "The grown-up code was used on the Y1."}
